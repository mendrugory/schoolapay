<section class="section" id="features">
  <div class="container">
    <p class="eyebrow">{{ .data.eyebrow }}</p>
    <h2 class="section-title">{{ .data.headline }}</h2>
    <div class="features-grid">
      {{ range .data.cards }}
      <article class="card feature-card">
        <div class="feature-icon-wrap feature-icon--{{ .icon }}">
          {{ partial "icon.html" (dict "name" .icon) }}
        </div>
        <h3>{{ .title }}</h3>
        <p>{{ .description }}</p>
      </article>
      {{ end }}
    </div>
  </div>
</section>
