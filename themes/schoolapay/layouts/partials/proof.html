<section class="section" id="proof">
  <div class="container">
    <p class="eyebrow">{{ .data.eyebrow }}</p>
    <h2 class="section-title">{{ .data.headline }}</h2>
    <div class="proof-metrics">
      {{ range .data.metrics }}
      <article class="card proof-metric">
        <p class="metric-label">{{ .title }}</p>
        <p class="metric-value">{{ .value }}</p>
      </article>
      {{ end }}
    </div>
    <div class="proof-testimonials">
      {{ range seq 2 }}
      <article class="card testimonial-placeholder">
        <p class="placeholder-label">{{ $.data.testimonial_label }}</p>
        <p>{{ $.data.testimonial_copy }}</p>
      </article>
      {{ end }}
    </div>
    <div class="section-cta">
      <button type="button" class="btn btn-secondary" disabled>Case Studies Coming Soon</button>
    </div>
  </div>
</section>
