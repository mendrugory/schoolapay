<section class="section section-alt" id="security">
  <div class="container trust-grid">
    <div class="trust-copy">
      <p class="eyebrow">{{ .data.eyebrow }}</p>
      <h2 class="section-title">{{ .data.headline }}</h2>
      <p class="section-lead">{{ .data.copy }}</p>
    </div>
    <div class="trust-shield" aria-hidden="true">
      <svg class="shield-icon" viewBox="0 0 80 96" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 4L8 16v28c0 22 14 42 32 48 18-6 32-26 32-48V16L40 4z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
        <path d="M40 28l-8 8 3 12 5-4 5 4 3-12-8-8z" fill="#2563EB"/>
      </svg>
    </div>
    <div class="trust-cards">
      {{ range .data.cards }}
      <article class="card trust-card">
        <div class="trust-card-icon trust-card-icon--{{ .icon }}" aria-hidden="true">
          {{ partial "icon.html" (dict "name" .icon) }}
        </div>
        <div>
          <h3>{{ .title }}</h3>
          <p>{{ .description }}</p>
        </div>
      </article>
      {{ end }}
    </div>
  </div>
</section>
