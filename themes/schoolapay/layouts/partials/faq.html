<section class="section section-alt" id="faq">
  <div class="container faq-container">
    <h2 class="section-title">{{ .data.headline }}</h2>
    <div class="faq-list">
      {{ range $i, $item := .data.items }}
      <div class="faq-item">
        <h3>
          <button type="button" class="faq-trigger" aria-expanded="false" aria-controls="faq-panel-{{ $i }}" id="faq-trigger-{{ $i }}">
            {{ $item.question }}
            <span class="faq-icon" aria-hidden="true"></span>
          </button>
        </h3>
        <div class="faq-panel" id="faq-panel-{{ $i }}" role="region" aria-labelledby="faq-trigger-{{ $i }}" hidden>
          <p>{{ $item.answer }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
