faq:
  headline: "Frequently asked questions."
  items:
    - question: How do parents make payments?
      answer: "Parents receive an activity notification and can complete payment from their mobile device. After payment, they receive a digital receipt and, when needed, a QR ticket."
    - question: Can schools issue refunds?
      answer: "Yes. Refund workflows can be handled through the school admin process, with clear records for finance and operations teams."
    - question: How does QR ticket validation work?
      answer: "Each eligible activity or event can generate a unique QR ticket after payment confirmation. Staff can scan the ticket at entry to validate attendance and reduce duplicate use."
    - question: Is SchoolaPay secure?
      answer: "SchoolaPay is designed around secure payment workflows, role-based access, clear records, and responsible handling of parent and student information."
    - question: Can parents manage multiple children?
      answer: "Yes. Parents can manage activities, payments, receipts, and tickets for multiple children from one account."
    - question: What reports are available?
      answer: "Schools can track payment status, participation, receipts, activity records, attendance scans, and reconciliation exports."
    - question: How does parent onboarding work?
      answer: "The onboarding flow is designed to be simple and mobile-first, helping parents connect to their child profile and view assigned activities quickly."
    - question: Does it work on mobile devices?
      answer: "Yes. SchoolaPay is designed mobile-first for busy parents and staff who need quick access from their phones."

